name: Deploy Azure Function
on:
  push:
    branches: [main]
    paths:
      - "env/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - staging
          - production

# Aucun droit par défaut : chaque job déclare uniquement ce dont il a besoin
permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.detect-env.outputs.environment }}
      deploy_script: ${{ steps.detect-env.outputs.deploy_script }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect environment
        id: detect-env
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ENVIRONMENT="$INPUT_ENVIRONMENT"
          else
            # Récupérer les fichiers modifiés dans le dernier commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

            # Détecter l'environnement modifié
            if echo "$CHANGED_FILES" | grep -q "^env/production/"; then
              ENVIRONMENT=production
            elif echo "$CHANGED_FILES" | grep -q "^env/staging/"; then
              ENVIRONMENT=staging
            else
              ENVIRONMENT=none
            fi
          fi

          case "$ENVIRONMENT" in
            production|staging) echo "deploy_script=deploy-$ENVIRONMENT" >> "$GITHUB_OUTPUT" ;;
            none) echo "No environment-specific changes detected. Skipping deployment." ;;
            *) echo "Unknown environment: $ENVIRONMENT"; exit 1 ;;
          esac

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}

  deploy:
    needs: detect
    if: needs.detect.outputs.environment != 'none'
    runs-on: ubuntu-latest
    # Environnement GitHub : règles de protection (reviewers, branches) et secrets scopés par environnement
    environment: ${{ needs.detect.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.detect.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Azure OIDC
    env:
      ENVIRONMENT: ${{ needs.detect.outputs.environment }}
      ONEPASSWORD_VAULT: ${{ vars.ONEPASSWORD_VAULT || 'Azure-Infra-Secret' }}
      ONEPASSWORD_ENV_ITEM: "neuralis-desk-infra"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure 1Password CLI
        uses: 1password/install-cli-action@143a85f84a90555d121cde2ff5872e393a47ab9f # v1.0.0

      - name: Load azure credentials from 1Password
        id: load-azure-creds
        run: ./scripts/ci/load-op-env.sh "op://$ONEPASSWORD_VAULT/$ONEPASSWORD_ENV_ITEM.$ENVIRONMENT.azure/notesPlain"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # OIDC (identité fédérée) : utilisé dès que AZURE_CLIENT_SECRET est retiré de l'item 1Password
      - name: Azure Login (OIDC)
        if: steps.load-azure-creds.outputs.AZURE_CLIENT_SECRET == ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ steps.load-azure-creds.outputs.AZURE_CLIENT_ID }}
          tenant-id: ${{ steps.load-azure-creds.outputs.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.load-azure-creds.outputs.AZURE_SUBSCRIPTION_ID }}

      # Legacy : secret client, à supprimer une fois l'OIDC en place sur tous les environnements
      - name: Azure Login (client secret)
        if: steps.load-azure-creds.outputs.AZURE_CLIENT_SECRET != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          creds: '{"clientId":"${{ steps.load-azure-creds.outputs.AZURE_CLIENT_ID }}","clientSecret":"${{ steps.load-azure-creds.outputs.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ steps.load-azure-creds.outputs.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ steps.load-azure-creds.outputs.AZURE_TENANT_ID }}"}'

      - name: Sync .env from 1Password to Azure Key Vault
        id: sync-env
        run: |
          ENV_REFERENCE="op://$ONEPASSWORD_VAULT/$ONEPASSWORD_ENV_ITEM.$ENVIRONMENT.deploy/notesPlain"

          echo "Syncing .env file from 1Password to Azure Key Vault..."
          echo "Environment: $ENVIRONMENT"

          # Lecture en mémoire uniquement : aucun fichier temporaire sur le runner
          CONTENT=$(op read "$ENV_REFERENCE")

          # Parser et synchroniser chaque variable
          while IFS='=' read -r key value; do
            # Ignorer les lignes vides et les commentaires
            if [[ -z "$key" || "$key" =~ ^[[:space:]]*# ]]; then
              continue
            fi

            # Nettoyer la clé (supprimer les espaces)
            key=$(echo "$key" | xargs)

            if [[ "$key" == "KEY_VAULT_NAME" ]]; then
              KEY_VAULT_NAME="$value"
              echo "Key Vault name set to: $KEY_VAULT_NAME"
              echo "KEY_VAULT_NAME=$value" >> "$GITHUB_OUTPUT"
              continue
            fi

            if [ -z "$KEY_VAULT_NAME" ]; then
              echo "Error: KEY_VAULT_NAME must be defined in the .env file before other variables"
              exit 1
            fi

            # Nettoyer la valeur (supprimer les guillemets si présents)
            value=$(echo "$value" | sed 's/^["'\'']//' | sed 's/["'\'']$//')

            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
            fi

            # Convertir la clé en format compatible Key Vault (tirets)
            secret_name=$(echo "$key" | tr '_' '-')

            echo "Syncing $key -> $secret_name"

            # Créer/mettre à jour le secret dans Key Vault
            az keyvault secret set \
              --vault-name "$KEY_VAULT_NAME" \
              --name "$secret_name" \
              --value "$value" \
              --tags "environment=$ENVIRONMENT" "source=1password" "original-key=$key" \
              --output none

            echo "$key synced to Key Vault as $secret_name"

          done <<< "$CONTENT"

          echo "✅ Successfully synced .env variables to Azure Key Vault!"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Deploy to detected environment
        run: |
          # L'URL de la base reste dans ce step : jamais exposée en sortie de step
          DATABASE_URL=$(az keyvault secret show --name "POSTGRES-CONNECTION-STRING" --vault-name "$KEY_VAULT_NAME" --query value -o tsv)
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL

          echo "Deploying to environment: $ENVIRONMENT"
          pnpm run "$DEPLOY_SCRIPT"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEY_VAULT_NAME: ${{ steps.sync-env.outputs.KEY_VAULT_NAME }}
          DEPLOY_SCRIPT: ${{ needs.detect.outputs.deploy_script }}
